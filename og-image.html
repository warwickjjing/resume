<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image — 서상훈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og-root {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 55% 80% at 25% 50%, rgba(0,255,136,0.07), transparent),
        repeating-linear-gradient(0deg, rgba(0,255,136,0.03) 0px, rgba(0,255,136,0.03) 1px, transparent 1px, transparent 44px),
        repeating-linear-gradient(90deg, rgba(0,255,136,0.03) 0px, rgba(0,255,136,0.03) 1px, transparent 1px, transparent 44px),
        #030608;
      font-family: 'JetBrains Mono', monospace;
      color: #b0bec5;
      display: flex;
      flex-direction: column;
      padding: 52px 64px 0;
      overflow: hidden;
    }

    /* ── Bottom neon line ── */
    .og-root::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff88 30%, #38bdf8 60%, #a78bfa, transparent);
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }
    .top-domain {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #ecf0f1;
      letter-spacing: -0.5px;
    }
    .top-domain span { color: #00ff88; }
    .top-badge {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #00ff88;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.28);
      padding: 5px 16px;
      border-radius: 2px;
    }

    /* ── Sub label ── */
    .sub-label {
      font-size: 12px;
      color: #546e7a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Main name ── */
    .main-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 86px;
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 24px;
    }
    .main-name .name-ko { color: #ecf0f1; }
    .main-name .name-dot { color: #00ff88; }

    /* ── Description ── */
    .desc {
      font-size: 20px;
      line-height: 1.65;
      color: #b0bec5;
      max-width: 620px;
      margin-bottom: 48px;
    }
    .desc strong { color: #ecf0f1; }

    /* ── Tech tags + URL row ── */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: absolute;
      bottom: 44px; left: 64px; right: 64px;
    }
    .tags { display: flex; gap: 10px; flex-wrap: wrap; }
    .tag {
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.22);
      padding: 5px 14px;
      border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .tag.g { color: #00ff88; background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.22); }
    .tag.p { color: #a78bfa; background: rgba(167,139,250,0.08); border-color: rgba(167,139,250,0.22); }
    .site-url {
      font-size: 12px;
      color: #546e7a;
      letter-spacing: 0.08em;
    }
    .site-url span { color: #00ff88; }
  </style>
</head>
<body>
  <div class="og-root">
    <div class="top-bar">
      <div class="top-domain"><span>서상훈</span>.dev</div>
      <div class="top-badge">FullStack Developer</div>
    </div>

    <div class="sub-label">Portfolio · Seoul, KR</div>

    <div class="main-name">
      <span class="name-ko">서상훈</span><span class="name-dot">.</span>
    </div>

    <div class="desc">
      인증 아키텍처를 설계하고,<br>
      팀의 <strong>기술 방향을 결정</strong>합니다.
    </div>

    <div class="bottom-row">
      <div class="tags">
        <span class="tag g">Vue3</span>
        <span class="tag">Spring Boot</span>
        <span class="tag g">JWT</span>
        <span class="tag">K8S</span>
        <span class="tag p">Identity Broker</span>
      </div>
      <div class="site-url">warwickjjing.github.io/<span>resume</span></div>
    </div>
  </div>
</body>
</html>
<!--
  ── How to generate og-image.png ──
  1. Open this file in Chrome/Edge (File > Open, or drag to browser)
  2. Open DevTools > right-click on <html> > Capture screenshot
     OR use the browser extension "GoFullPage" or "Screenshot Capture"
  3. Crop / save exactly at 1200×630px
  4. Save as public/og-image.png
-->
